name: Himawari ad-hoc True Color + winds

# Separate from the operational "Himawari RGB" workflow: nothing here touches himawari-output, its images,
# its housekeeping or its site. Results go to the artifact and to the orphan branch himawari-adhoc.
# Manual only. Defaults (this branch): 13 Oct 2026 06:00 UTC scan, 13 Oct 06Z analysis winds, high-confidence hotspots of 13 Oct.
on:
  workflow_dispatch:
    inputs:
      scan_utc:
        description: "Himawari scan time UTC as YYYYMMDDHHMM (minute ends in 0); several allowed, comma-separated (a series, run one after the other)"
        required: false
        default: "202610140800"
        type: string
      wind_run_utc:
        description: "ECMWF IFS run YYYYMMDDHH (UTC; hour 00, 06, 12 or 18); empty = no winds; same-day-06 = the 06Z run of each scan's own day (for a series)"
        required: false
        default: ""
        type: string
      wind_step:
        description: "ECMWF forecast step in hours (0 = the run's analysis time; multiples of 3)"
        required: false
        default: "0"
        type: string
      hotspots_csv:
        description: "Optional CSV of hotspots (lat, lon, frp_mw) to draw in red; none = no hotspots; {date} is replaced by the scan day YYYYMMDD (for a series)"
        required: false
        default: "data/hotspots_highconf_20261014.csv"
        type: string
      hotspot_label:
        description: "Caption text for the hotspots, e.g. 13 Oct 2026; empty = the scan day (for a series)"
        required: false
        default: ""
        type: string
      hotspot_desc:
        description: "Caption text for the hotspots ({label} = the label); empty = the high-confidence VIIRS text"
        required: false
        default: ""
        type: string
      caption:
        description: "Draw the caption box"
        required: false
        default: true
        type: boolean
      rayleigh:
        description: "Apply Rayleigh correction (as the operational True Color does)"
        required: false
        default: true
        type: boolean

concurrency:
  group: himawari-adhoc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adhoc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADHOC_BRANCH: himawari-adhoc
      # Same location and cache key as the operational workflow, so the Rayleigh look-up tables are shared.
      PSP_DATA_ROOT: ${{ github.workspace }}/.pyspectral-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Make sure bzip2 is available
        run: command -v bzip2 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bzip2; }

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache pyspectral data (Rayleigh LUTs)
        if: ${{ inputs.rayleigh }}
        uses: actions/cache@v4
        with:
          path: .pyspectral-data
          key: pyspectral-${{ runner.os }}-v1

      - name: Build the plot
        env:
          IN_SCAN: ${{ inputs.scan_utc }}
          IN_WIND_RUN: ${{ inputs.wind_run_utc }}
          IN_WIND_STEP: ${{ inputs.wind_step }}
          IN_RAYLEIGH: ${{ inputs.rayleigh }}
          IN_CAPTION: ${{ inputs.caption }}
          IN_HOTSPOT_DESC: ${{ inputs.hotspot_desc }}
          IN_HOTSPOTS: ${{ inputs.hotspots_csv }}
          IN_HOTSPOT_LABEL: ${{ inputs.hotspot_label }}
        run: |
          failed=()
          for scan in ${IN_SCAN//,/ }; do
            d="${scan:0:8}"
            args=(--scan "$scan" --wind-step "$IN_WIND_STEP" --outdir output-adhoc)
            wr="$IN_WIND_RUN"; [ "$wr" = "same-day-06" ] && wr="${d}06"
            if [ -n "$wr" ]; then args+=(--wind-run "$wr"); fi
            if [ "$IN_RAYLEIGH" = "true" ]; then args+=(--rayleigh); else args+=(--no-rayleigh); fi
            if [ "$IN_CAPTION" != "true" ]; then args+=(--no-caption); fi
            if [ -n "$IN_HOTSPOTS" ] && [ "$IN_HOTSPOTS" != "none" ]; then
              label="$IN_HOTSPOT_LABEL"; [ -z "$label" ] && label="$(date -d "$d" +'%-d %b %Y')"
              if [ -n "$IN_HOTSPOT_DESC" ]; then args+=(--hotspot-desc "$IN_HOTSPOT_DESC"); fi
              args+=(--hotspots "${IN_HOTSPOTS//\{date\}/$d}" --hotspot-label "$label")
            fi
            echo "::group::scan $scan"
            python scripts/adhoc_truecolor_winds_hotspots.py "${args[@]}" || failed+=("$scan")
            echo "::endgroup::"
          done
          ls output-adhoc/*.png >/dev/null 2>&1 || { echo "::error::no image was produced"; exit 1; }
          if [ "${#failed[@]}" -gt 0 ]; then echo "::warning title=ad-hoc::failed scans: ${failed[*]}"; fi

      - name: Upload PNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: himawari-adhoc-${{ github.run_id }}
          path: output-adhoc/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the ad-hoc branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/pub-adhoc"
          rm -rf "$pub"; mkdir -p "$pub"
          # Keep earlier ad-hoc plots on the branch; only this branch is touched.
          if git ls-remote --exit-code --heads origin "$ADHOC_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$ADHOC_BRANCH"
            git archive FETCH_HEAD | tar -x -C "$pub"
          fi
          cp output-adhoc/*.png "$pub/"
          cd "$pub"
          git init -q -b "$ADHOC_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ad-hoc True Color: scan ${{ inputs.scan_utc }}, winds run ${{ inputs.wind_run_utc }} step ${{ inputs.wind_step }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ADHOC_BRANCH"

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Himawari ad-hoc True Color + winds"
            echo "Scan ${{ inputs.scan_utc }} UTC, ECMWF run ${{ inputs.wind_run_utc }}Z step ${{ inputs.wind_step }} h, Rayleigh ${{ inputs.rayleigh }}."
            echo "Files on branch \`himawari-adhoc\`: $(ls output-adhoc 2>/dev/null | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
