name: Himawari RGB

# Manual only (also runnable from the GitHub mobile app). No schedule on purpose.
# Builds True Color (JMA recipe), Day Fire (NOAA/CIRA recipe) and/or IR Enhanced (True Color + 10.4 um IR; also runs
# at night, when it is IR only) from the public NOAA NODD bucket.
on:
  workflow_dispatch:
    inputs:
      datetime_utc:
        description: "Scan time in UTC as YYYYMMDDHHMM (minute ends in 0). Blank = newest complete scan. 08:00 SGT = 0000 UTC"
        required: false
        default: ""
        type: string
      product:
        description: "Which image(s): all, true_color, ir_enhanced (True Color + IR; day and night), day_fire (3.9 um hotspots) or smoke (ASMC-style smoke/haze RGB). At night only ir_enhanced is made"
        required: false
        default: all
        type: choice
        options:
          - all
          - true_color
          - ir_enhanced
          - day_fire
          - smoke
      region:
        description: "Which region: sumatra_borneo (Sumatra, Malay Peninsula, Singapore, Borneo), mekong (Mekong sub-region), papua (132-141E, 11S-0N) or all (the three, one after the other in this run, published once). Each region has its own tab on the website"
        required: false
        default: sumatra_borneo
        type: choice
        options:
          - sumatra_borneo
          - mekong
          - papua
          - all
      bbox:
        description: "Box west,south,east,north in degrees. Blank = the region's (sumatra_borneo 94.5,-6.5,119.5,7.5; mekong 92,6,110.5,29; papua 132,-11,141,0)"
        required: false
        default: ""
        type: string
      gamma:
        description: "True color gamma override (blank = 1.7; try 2.0 for hazy scenes). Day fire ignores it"
        required: false
        default: ""
        type: string
      segments:
        description: "Full-disk segments to download, 1 = north ... 10 = south. Blank = the region's (sumatra_borneo 5-6; mekong 3-5; papua 6-7)"
        required: false
        default: ""
        type: string
      resolution:
        description: "Output pixel size in degrees (0.01 is about 1 km)"
        required: false
        default: "0.01"
        type: string
      winds:
        description: "Overlay ECMWF 925 hPa wind streamlines (orange; white on IR Enhanced). If ECMWF data fail the images are still published without them"
        required: false
        default: true
        type: boolean
      coastlines:
        description: "Draw coastlines (Natural Earth 1:10m; green, or magenta on day fire); untick for clean images"
        required: false
        default: true
        type: boolean
      graticule:
        description: "Draw faint labelled lat/lon lines every 5 degrees; untick for a clean image"
        required: false
        default: true
        type: boolean
      fire:
        description: "True color and smoke RGB: mark fire pixels (hot 3.9 um signal, 325 K and 8 K above surroundings) in red. An addition, not an official fire product"
        required: false
        default: true
        type: boolean
      cloud_cue:
        description: "Day fire only: show cold cloud (10.4 um below ~290 K) in grey so it stands apart from smoke"
        required: false
        default: true
        type: boolean
      sun_correction:
        description: "Day fire and smoke RGB: divide the 0.86/0.64 um channels by cos(sun zenith) so brightness does not follow the sun"
        required: false
        default: true
        type: boolean
      rayleigh:
        description: "True color (and the True Color base of IR Enhanced): apply Rayleigh correction (on by default; untick for the plain JMA recipe, a bit faster)"
        required: false
        default: true
        type: boolean

# One run at a time, so the output branch is never updated concurrently.
concurrency:
  group: himawari-output
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rgb:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # region "all" builds three regions one after the other
    env:
      OUTPUT_BRANCH: himawari-output
      KEEP_DAYS: "2"  # published images older than this many days are removed (scripts/housekeeping.py)
      PSP_DATA_ROOT: ${{ github.workspace }}/.pyspectral-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Make sure bzip2 is available
        run: |
          command -v bzip2 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bzip2; }
          bzip2 --help 2>&1 | head -n 1 || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache pyspectral data (Rayleigh LUTs)
        if: ${{ inputs.rayleigh && inputs.product != 'day_fire' && inputs.product != 'smoke' }}
        uses: actions/cache@v4
        with:
          path: .pyspectral-data
          key: pyspectral-${{ runner.os }}-v1

      - name: Build RGB image(s)
        id: build
        env:
          IN_DATETIME: ${{ inputs.datetime_utc }}
          IN_PRODUCT: ${{ inputs.product }}
          IN_REGION: ${{ inputs.region }}
          IN_BBOX: ${{ inputs.bbox }}
          IN_GAMMA: ${{ inputs.gamma }}
          IN_SEGMENTS: ${{ inputs.segments }}
          IN_RESOLUTION: ${{ inputs.resolution }}
          IN_RAYLEIGH: ${{ inputs.rayleigh }}
          IN_COASTLINES: ${{ inputs.coastlines }}
          IN_WINDS: ${{ inputs.winds }}
          IN_GRATICULE: ${{ inputs.graticule }}
          IN_FIRE: ${{ inputs.fire }}
          IN_CLOUD_CUE: ${{ inputs.cloud_cue }}
          IN_SUN_CORRECTION: ${{ inputs.sun_correction }}
        run: |
          # One region, or "all" = the three regions one after the other in this run (one dispatch, one publish: several
          # dispatches at once cannot all run, the workflow lock keeps only one run waiting).
          if [ "$IN_REGION" = "all" ]; then
            regions=(sumatra_borneo mekong papua)
            if [ -n "${IN_BBOX// /}${IN_SEGMENTS// /}" ]; then echo "::warning::bbox and segments are ignored with region all"; fi
          else
            regions=("$IN_REGION")
          fi
          mkdir -p output
          for region in "${regions[@]}"; do
            echo "::group::Region $region"
            args=(
              --datetime-utc "$IN_DATETIME"
              --product "$IN_PRODUCT"
              --region "$region"
              --resolution "$IN_RESOLUTION"
              --outdir output
              --workdir "$RUNNER_TEMP"
              --json-out "output/result-$region.json"
            )
            if [ "$IN_REGION" != "all" ]; then
              if [ -n "${IN_BBOX// /}" ]; then args+=(--bbox "$IN_BBOX"); fi
              if [ -n "${IN_SEGMENTS// /}" ]; then args+=(--segments "$IN_SEGMENTS"); fi
            fi
            if [ -n "${IN_GAMMA// /}" ]; then args+=(--gamma "$IN_GAMMA"); fi
            if [ "$IN_RAYLEIGH" = "true" ]; then args+=(--rayleigh); else args+=(--no-rayleigh); fi
            if [ "$IN_COASTLINES" = "true" ]; then args+=(--coastlines); else args+=(--no-coastlines); fi
            if [ "$IN_WINDS" = "true" ]; then args+=(--winds); else args+=(--no-winds); fi
            if [ "$IN_GRATICULE" = "true" ]; then args+=(--graticule); else args+=(--no-graticule); fi
            if [ "$IN_FIRE" = "true" ]; then args+=(--fire); else args+=(--no-fire); fi
            if [ "$IN_CLOUD_CUE" = "true" ]; then args+=(--cloud-cue); else args+=(--no-cloud-cue); fi
            if [ "$IN_SUN_CORRECTION" = "true" ]; then args+=(--sun-correction); else args+=(--no-sun-correction); fi
            python scripts/himawari_truecolor.py "${args[@]}" || echo "::warning::region $region exited with status $?"
            if [ ! -f "output/result-$region.json" ]; then
              jq -n --arg r "$region" '{status:"error", region:$r, message:"see the log"}' > "output/result-$region.json"
            else  # error results written by the script carry no region
              jq --arg r "$region" '.region = (.region // $r)' "output/result-$region.json" > "output/result-$region.tmp" && mv "output/result-$region.tmp" "output/result-$region.json"
            fi
            echo "::endgroup::"
          done
          # One combined result for the steps below: ok if any region made images, else skipped_night, else error.
          jq -s '{
            status: (if any(.[]; .status == "ok") then "ok" elif any(.[]; .status == "skipped_night") then "skipped_night" else "error" end),
            region: (map(.region // empty) | unique | if length > 1 then "all" else (.[0] // "") end),
            scan_utc_iso: (([.[] | select(.status == "ok") | .scan_utc_iso] | first) // (.[0].scan_utc_iso // "")),
            scan_sgt_iso: (([.[] | select(.status == "ok") | .scan_sgt_iso] | first) // (.[0].scan_sgt_iso // "")),
            message: ([.[] | select(.status == "error") | .message] | join("; ")),
            outputs: ([.[] | .outputs // []] | add // [])
          }' output/result-*.json > output/result.json
          jq -c '{status, region, scan_utc_iso, n_outputs: (.outputs | length)}' output/result.json
          # Fail the step only when no region made anything (a single failing region fails as it always did).
          if [ "$(jq -r .status output/result.json)" = "error" ]; then exit 1; fi

      - name: Read result
        id: result
        if: ${{ always() }}
        run: |
          if [ -f output/result.json ]; then
            echo "status=$(jq -r .status output/result.json)" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PNG artifact
        if: ${{ steps.result.outputs.status == 'ok' }}
        uses: actions/upload-artifact@v4
        with:
          name: himawari-rgb-${{ github.run_id }}
          path: output/**/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish to output branch
        if: ${{ steps.result.outputs.status == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$GITHUB_WORKSPACE/output/result.json"
          pub="$RUNNER_TEMP/publish"
          rm -rf "$pub"; mkdir -p "$pub"

          # Carry over the images already on the branch (if it exists yet).
          if git ls-remote --exit-code --heads origin "$OUTPUT_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$OUTPUT_BRANCH"
            git archive FETCH_HEAD | tar -x -C "$pub"
          fi

          # One folder per product and region: Sumatra-Borneo True Color at the top level (so existing links
          # keep working), the others in subfolders (dayfire/, ir/, mekong/, mekong/dayfire/ ...).
          # Each gets <scan>.png plus latest.png.
          while IFS='|' read -r product png sub; do
            dir="$pub${sub:+/$sub}"
            mkdir -p "$dir"
            name=$(basename "$png")
            cp "$GITHUB_WORKSPACE/$png" "$dir/$name"
            cp "$GITHUB_WORKSPACE/$png" "$dir/latest.png"
            echo "Published $product -> ${sub:+$sub/}$name"
          done < <(jq -r '.outputs[] | [.product, .png, .subdir] | join("|")' "$result")

          # Housekeeping: drop images whose scan time is more than KEEP_DAYS old (never the ones
          # just published, never latest.png). Thumbnails of removed images go in build_site.py.
          mapfile -t just_published < <(jq -r '.outputs[].png | split("/")[-1]' "$result" | sort -u)
          python "$GITHUB_WORKSPACE/scripts/housekeeping.py" "$pub" --max-age-days "$KEEP_DAYS" --keep "${just_published[@]}"

          # Static site (index.html + thumbnails) served by GitHub Pages from this branch.
          python "$GITHUB_WORKSPACE/scripts/build_site.py" "$pub"

          # Orphan branch holding a single fresh commit: history never grows, so the
          # repo stays small even though every commit adds ~5 MB PNGs.
          cd "$pub"
          git init -q -b "$OUTPUT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Himawari RGB $(jq -r .scan_utc_iso "$result") ($(jq -r .region "$result"))"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$OUTPUT_BRANCH"
          echo "Pushed $(find . -name '*.png' | wc -l) PNGs to $OUTPUT_BRANCH"

      - name: Job summary
        if: ${{ always() }}
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          owner="${REPO%%/*}"; repo_name="${REPO#*/}"
          report() {
            r=$1
            echo "### Region: $(jq -r '.region // "?"' $r)"
            case "$(jq -r .status $r)" in
              ok)
                echo "**Scan:** $(jq -r .scan_utc_iso $r) / $(jq -r .scan_sgt_iso $r)  "
                echo "**Sun zenith at bbox centre:** $(jq -r .sun_zenith_centre $r)°  "
                echo "**Segments:** $(jq -r '.segments | map(tostring) | join(",")' $r), bands $(jq -r '.bands | join("/")' $r) (all files present)  "
                echo "**Winds:** $(jq -r '.winds // "n/a"' $r)  "
                if jq -e '(.winds // "") | startswith("skipped")' $r >/dev/null; then echo "**:warning: Wind streamlines were skipped** - the images below have none (reason on the Winds line)  "; fi
                if jq -e '(.winds // "") | contains("[newest run unavailable")' $r >/dev/null; then echo "**:warning: Winds are from an older ECMWF run** than the newest (reason on the Winds line)  "; fi
                if [ -n "$(jq -r '.low_sun // empty' $r)" ]; then echo "**:warning: Low sun:** $(jq -r .low_sun $r)"; fi
                if [ -n "$(jq -r '.skipped_products // empty | join(", ")' $r)" ]; then echo "**Night:** skipped $(jq -r '.skipped_products | join(", ")' $r) (daytime only); only the products below were made.  "; fi
                echo
                while IFS='|' read -r label png sub size; do
                  name=$(basename "$png"); path="${sub:+$sub/}"
                  echo "- **$label** ($size px): [\`$OUTPUT_BRANCH:$path$name\`]($SERVER/$REPO/blob/$OUTPUT_BRANCH/$path$name), [latest]($SERVER/$REPO/blob/$OUTPUT_BRANCH/${path}latest.png)"
                done < <(jq -r '.outputs[] | [.label, .png, .subdir, "\(.size_px[0])x\(.size_px[1])"] | join("|")' $r)
                ;;
              skipped_night)
                echo "**Skipped (night):** scan $(jq -r .scan_utc_iso $r) / $(jq -r .scan_sgt_iso $r)," \
                     "sun zenith $(jq -r .sun_zenith_centre $r)° at the bbox centre. These RGB products are daytime only; no image made (IR Enhanced would still run at night)."
                ;;
              *)
                echo "**Failed.** $(jq -r '.message // "see the log"' $r 2>/dev/null || echo "see the log")"
                ;;
            esac
            echo
          }
          {
            echo "## Himawari-9 RGB"
            if ls output/result-*.json >/dev/null 2>&1; then
              for f in output/result-*.json; do report "$f"; done
              echo "- Website: https://$owner.github.io/$repo_name/"
              echo "- Also attached to this run as an artifact."
            else
              echo "**Failed.** No result was written; see the log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
